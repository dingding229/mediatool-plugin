name: Verify built-in Go plugin library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l sdk plugins registry)"
      - name: Compile pinned-module public API without CGO
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit, contracts and golden (real Go stdio child)
        run: go test -p 1 -count=1 -v ./...
      - name: Race and repeated cancellation/concurrency/golden
        run: go test -race -p 1 -count=3 ./...
      - name: No generated build products
        run: test -z "$(git status --porcelain)"
